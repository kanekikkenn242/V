name: iOS 3105 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_NAME: "X"
      BUNDLE_ID: "com.apple.mobile.MobileHouseArrest"
      WORKSPACE: "ThreeOneOSFive.xcodeproj"
      SCHEME: "ThreeOneOSFive"
      MIN_IOS_VERSION: "27.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display branch info
        run: |
          echo "Building branch: ${{ github.ref_name }}"

      - name: Install Xcode
        run: |
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          sudo xcodebuild -license accept 2>/dev/null || true

      - name: Setup Xcode
        run: |
          xcodebuild -version
          xcode-select -print-path

      - name: Update Info.plist version
        run: |
          plutil -replace CFBundleShortVersionString -string "V" ThreeOneOSFive/Info.plist
          plutil -replace MinimumOSVersion -string "27.0" ThreeOneOSFive/Info.plist

      - name: Build App
        run: |
          xcodebuild \
            -project "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive App
        run: |
          xcodebuild \
            -project "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/${SCHEME}.xcarchive" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export IPA
        run: |
          mkdir -p ./dist
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/${SCHEME}.xcarchive" \
            -exportPath "$PWD/dist" \
            -exportOptionsPlist "$PWD/export_options.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-iOS27-${{ github.sha }}
          path: ./dist/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: "iOS 3105 Build v%APP_VERSION% - iOS 27.0.1+ support ready. Version V. iOS 27 support patched. PR approved."
